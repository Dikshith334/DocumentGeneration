<main class="container-fluid customer-management-page">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/operations">Operations</a></li>
      <li class="breadcrumb-item active">Customer Management</li>
    </ol>
  </nav>

  <header class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1>Customer Management</h1>
      <p class="page-description">Find, maintain, import, and export customer records.</p>
    </div>
    <div class="d-flex gap-2">
      <button mat-stroked-button type="button" (click)="openImportDialog()" matTooltip="Import customers from Excel">
        <mat-icon>upload_file</mat-icon> Import
      </button>
      <button mat-stroked-button type="button" (click)="exportCustomers()" matTooltip="Export filtered customers">
        <mat-icon>download</mat-icon> Export
      </button>
      <button mat-raised-button color="primary" type="button" (click)="addCustomer()" matTooltip="Create a customer">
        <mat-icon>add</mat-icon> Add customer
      </button>
    </div>
  </header>

  <section class="card mb-4 filter-panel" aria-labelledby="filter-heading">
    <div class="card-body">
      <h2 id="filter-heading" class="card-title">Find customers</h2>
      <div class="row g-3 align-items-end">
        <mat-form-field class="col-md-6">
          <mat-label>Search</mat-label>
          <input matInput id="customerSearch" name="customerSearch" type="search"
                 placeholder="Customer name or email" [(ngModel)]="filters.search" />
        </mat-form-field>
        <mat-form-field class="col-md-3">
          <mat-label>Status</mat-label>
          <mat-select name="status" [(ngModel)]="filters.status" (selectionChange)="applyFilters()">
            <mat-option value="">All statuses</mat-option>
            <mat-option value="active">Active</mat-option>
            <mat-option value="inactive">Inactive</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="col-md-3 d-flex gap-2">
          <button mat-raised-button color="primary" type="button" (click)="searchCustomers()" matTooltip="Apply search">Search</button>
          <button mat-button type="button" (click)="toggleAdvancedFilters()" matTooltip="Show more filters">Advanced Filter</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="table-heading">
    <div class="card-body">
      <h2 id="table-heading" class="card-title">Customers</h2>
      <mat-table [dataSource]="customers" matSort aria-label="Customer table">
        <ng-container matColumnDef="customerId"><mat-header-cell *matHeaderCellDef mat-sort-header>Customer ID</mat-header-cell></ng-container>
        <ng-container matColumnDef="customerName"><mat-header-cell *matHeaderCellDef mat-sort-header>Customer Name</mat-header-cell></ng-container>
        <ng-container matColumnDef="email"><mat-header-cell *matHeaderCellDef mat-sort-header>Email</mat-header-cell></ng-container>
        <ng-container matColumnDef="status"><mat-header-cell *matHeaderCellDef>Status</mat-header-cell></ng-container>
        <ng-container matColumnDef="createdDate"><mat-header-cell *matHeaderCellDef mat-sort-header>Created Date</mat-header-cell></ng-container>
        <ng-container matColumnDef="actions">
          <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
          <mat-cell *matCellDef="let customer">
            <button mat-icon-button type="button" (click)="editCustomer(customer)" [disabled]="customer.status === 'Inactive'" matTooltip="Edit customer" aria-label="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button type="button" (click)="deleteCustomer(customer)" *ngIf="currentUser.isAdmin" matTooltip="Delete customer" aria-label="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        <div matNoDataRow class="no-data">No customers match the current filters.</div>
      </mat-table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [pageSize]="25" aria-label="Customer table pagination"></mat-paginator>
    </div>
  </section>
</main>
